services:
  - type: web
    name: neighborboost-atl
    runtime: python
    plan: free
    region: oregon
    branch: feature/combined-mvp
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    autoDeploy: true
    healthCheckPath: /
